baseURL = "https://joeagent.dev/"
languageCode = "en-us"
defaultContentLanguage = "en-us"
title = "Joe"
enableRobotsTXT = false
enableEmoji = false

# Single page. No blog, no taxonomies, no feeds.
disableKinds = ["taxonomy", "term", "RSS", "section"]

[outputs]
  home = ["HTML"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "Joe is a Kubernetes AI copilot you run locally, with your own LLM key."
  author = "Jaime Gago"

  # ---------------------------------------------------------------------------
  # PLACEHOLDER VALUES — fill these in during the later pass.
  # Every fill-in point on the page reads from here. Grep the repo for
  # "PLACEHOLDER" to find these plus the matching markers in layouts/index.html.
  # ---------------------------------------------------------------------------

  # PLACEHOLDER: install command. Fill in once Stream A.4 lands install.sh.
  # When real, also flip installPending = false to drop the "pending" caption.
  installCommand = "curl -fsSL https://joeagent.dev/install.sh | sh"
  installPending = true

  # PLACEHOLDER: Joe's public GitHub repo URL. Known after the public flip.
  repoURL = "https://github.com/jaimegago/joe"
  repoLabel = "github.com/jaimegago/joe"

  # OASIS standard — live, stable.
  oasisURL = "https://oasis-spec.dev"
  # OASIS evaluation results for Joe. URL is stable; page will be republished.
  oasisEvalURL = "https://oasis-spec.dev/evaluations/joe/"
  oasisEvalPending = true

  # Author site — live.
  authorURL = "https://jaimegago.dev"
