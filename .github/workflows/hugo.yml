name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
    steps:
      # Checkout first: later steps (setup-go reads go.mod, the docs sync, the
      # Hugo build) all need the repo on disk.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Hextra is a Hugo module, so Go must be available to resolve it.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Deterministic, pinned theme resolution: download exactly the versions
      # committed in go.mod / go.sum (Hextra v0.12.3) into the Go module cache
      # that Hugo reads. This populates the cache without floating the pin — no
      # bare `hugo mod get`, so a future deploy cannot drift to a newer Hextra.
      - name: Download pinned modules
        run: go mod download

      # Single-source the docs tree BEFORE the Hugo build. Reads the seeded
      # docs/public source by default; the source switch (and the one flip step
      # to Joe's public repo) lives in scripts/sync-docs.sh.
      - name: Sync documentation
        run: ./scripts/sync-docs.sh

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://joeagent.dev/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
